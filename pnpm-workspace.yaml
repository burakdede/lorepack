packages:
  - packages/*
  - apps/*
  - tools/*

# Invariant 7: nothing compiles, downloads or runs a script at install time.
#
# esbuild ships a postinstall that resolves its platform binary. It is a build-time
# dependency of Vite and never reaches a user, who installs the CLI with Studio already
# bundled. Verified 2026-08-03 that esbuild transforms correctly with the script declined,
# because it also resolves the binary through optionalDependencies, so refusing it costs
# nothing and keeps `pnpm install --ignore-scripts` a true statement about this workspace.
#
# Anything added here must be false. A true would be a native build step reaching a
# contributor's machine, which is the promise `check:no-native` exists to keep.
allowBuilds:
  esbuild: false
  sharp: set this to true or false
  # Same story as esbuild, verified 2026-08-06. `workerd` is the Cloudflare runtime Miniflare
  # embeds; it is a dev dependency of the deployment work only and never reaches a user. Its
  # binary arrives through `@cloudflare/workerd-<platform>` optional dependencies rather than
  # through the script, so declining it costs nothing: `wrangler --version` and a Worker with
  # live D1 and R2 bindings both work with it refused.
  workerd: false

minimumReleaseAgeExclude:
  - miniflare@5.20260801.0-alpha
  - wrangler@4.119.0

# pdfjs-dist declares `@napi-rs/canvas` as an optionalDependency and reaches for it at
# runtime if it is present. It is only needed to *render* a page, which Lorepack never does:
# the PDF parser extracts a text layer and nothing else. It is a native module, so letting it
# into the tree would break invariant 7 and the clean-install matrix for a capability we do
# not use.
#
# `-` removes it rather than pinning it, which is the only spelling that keeps it out of the
# lockfile. `check:no-native` already banned the package by name; this is what makes that
# check pass on a real install rather than only after someone deletes the directory.
overrides:
  '@napi-rs/canvas': '-'
