<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Lorepack architecture boundary</title>
  <desc id="desc">Core and compiler create immutable builds. Local and Cloudflare runtimes are projections. MCP, HTTP, SDK and bounded exports are read-only AI boundaries.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .zone { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.5; filter: url(#shadow); }
      .build { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .adapter { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .control { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; }
      .ai { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
      .forbidden { fill: #fee2e2; stroke: #ef4444; stroke-width: 1.5; }
      .title { font: 700 28px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 500 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
      .line { fill: none; stroke: #334155; stroke-width: 2.3; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1120" height="560" rx="28"/>
  <text class="title" x="48" y="58">One build, many read-only projections</text>
  <text class="body" x="48" y="86">Lorepack keeps parsing, storage, serving and deployment behind explicit boundaries.</text>

  <g transform="translate(48 128)">
    <rect class="zone" width="252" height="220" rx="24"/>
    <text class="label" x="26" y="38">Compiler plane</text>
    <text class="body" x="26" y="70">discovers sources</text>
    <text class="body" x="26" y="94">parses formats</text>
    <text class="body" x="26" y="118">preserves tables</text>
    <text class="body" x="26" y="142">validates catalog</text>
    <rect class="control" x="26" y="164" width="198" height="36" rx="12"/>
    <text class="mono" x="54" y="187">lore plan / build</text>
  </g>

  <g transform="translate(382 116)">
    <rect class="build" width="260" height="244" rx="30"/>
    <text class="label" x="34" y="44">Immutable build</text>
    <text class="body" x="34" y="78">content-addressed id</text>
    <text class="body" x="34" y="102">sealed SQLite catalog</text>
    <text class="body" x="34" y="126">normalized source objects</text>
    <text class="body" x="34" y="150">source locators everywhere</text>
    <text class="body" x="34" y="174">typed table metadata</text>
    <rect class="zone" x="34" y="198" width="190" height="28" rx="10"/>
    <text class="small" x="58" y="217">canonical source of truth</text>
  </g>

  <g transform="translate(730 120)">
    <rect class="adapter" width="160" height="76" rx="18"/>
    <text class="label" x="24" y="32">Local runtime</text>
    <text class="small" x="24" y="54">CLI, Studio, MCP</text>
    <rect class="adapter" y="108" width="160" height="76" rx="18"/>
    <text class="label" x="24" y="140">Cloudflare</text>
    <text class="small" x="24" y="162">remote projection</text>
  </g>

  <g transform="translate(952 104)">
    <rect class="ai" width="126" height="52" rx="14"/>
    <text class="label" x="24" y="24">MCP</text>
    <text class="small" x="24" y="40">read tools</text>
    <rect class="ai" y="70" width="126" height="52" rx="14"/>
    <text class="label" x="24" y="94">HTTP</text>
    <text class="small" x="24" y="110">REST and MCP</text>
    <rect class="ai" y="140" width="126" height="52" rx="14"/>
    <text class="label" x="24" y="164">Export</text>
    <text class="small" x="24" y="180">bounded bundle</text>
  </g>

  <path class="line" d="M300 238 H374"/>
  <path class="line" d="M642 174 H722"/>
  <path class="line" d="M642 258 H722"/>
  <path class="line" d="M890 158 H944"/>
  <path class="line" d="M890 228 C920 228 920 128 944 128"/>
  <path class="line" d="M890 228 C922 228 922 270 944 270"/>

  <g transform="translate(84 410)">
    <rect class="forbidden" width="380" height="74" rx="20"/>
    <text class="label" x="24" y="32">AI boundary is read-only</text>
    <text class="body" x="24" y="56">No build, deploy, source edit or shell tool crosses it.</text>
  </g>

  <g transform="translate(536 410)">
    <rect class="control" width="410" height="74" rx="20"/>
    <text class="label" x="24" y="32">Control stays local or operator-owned</text>
    <text class="body" x="24" y="56">Activation and rollback are explicit pointer changes.</text>
  </g>

  <text class="small" x="742" y="374">Runtime reads the build. It does not compile sources.</text>
</svg>
