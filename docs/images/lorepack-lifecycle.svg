<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Lorepack lifecycle from sources to active build</title>
  <desc id="desc">Source artifacts flow through plan, build, validate and activate into an immutable build that read-only runtimes serve. Diff and rollback compare and move pointers between existing builds.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/>
    </marker>
    <linearGradient id="buildGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.5; filter: url(#shadow); }
      .source { fill: #fefce8; stroke: #facc15; stroke-width: 1.5; }
      .stage { fill: #eef2ff; stroke: #818cf8; stroke-width: 1.5; }
      .build { fill: url(#buildGradient); stroke: #2563eb; stroke-width: 2; }
      .runtime { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
      .control { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; }
      .title { font: 700 28px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 500 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
      .small { font: 500 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .line { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow); }
      .softLine { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1120" height="520" rx="28"/>
  <text class="title" x="48" y="58">AI context gets a release lifecycle</text>
  <text class="body" x="48" y="86">Lorepack turns trusted project artifacts into immutable builds that can be inspected, served and rolled back.</text>

  <g transform="translate(48 125)">
    <rect class="source" width="190" height="150" rx="18"/>
    <text class="label" x="22" y="34">Source artifacts</text>
    <text class="body" x="22" y="64">Docs, spreadsheets,</text>
    <text class="body" x="22" y="85">PDF text, code notes</text>
    <text class="small" x="22" y="118">Inputs only</text>
    <text class="small" x="22" y="136">Never the live runtime</text>
  </g>

  <g transform="translate(300 124)">
    <rect class="panel" width="300" height="152" rx="22"/>
    <text class="label" x="24" y="34">Build pipeline</text>
    <g transform="translate(24 58)">
      <rect class="stage" width="112" height="38" rx="12"/>
      <text class="mono" x="28" y="24">plan</text>
      <rect class="stage" x="140" width="112" height="38" rx="12"/>
      <text class="mono" x="169" y="24">build</text>
      <path class="line" d="M116 19 H133"/>
    </g>
    <g transform="translate(24 108)">
      <rect class="stage" width="112" height="38" rx="12"/>
      <text class="mono" x="17" y="24">validate</text>
      <rect class="stage" x="140" width="112" height="38" rx="12"/>
      <text class="mono" x="164" y="24">seal</text>
      <path class="line" d="M116 19 H133"/>
    </g>
  </g>

  <g transform="translate(670 110)">
    <rect class="build" width="220" height="180" rx="28"/>
    <text class="label" x="32" y="42">Immutable build</text>
    <text class="mono" x="32" y="72">build id</text>
    <text class="body" x="32" y="102">catalog + objects</text>
    <text class="body" x="32" y="126">source locators</text>
    <text class="body" x="32" y="150">typed tables</text>
    <text class="small" x="32" y="168">Canonical source of truth</text>
  </g>

  <g transform="translate(952 126)">
    <rect class="runtime" width="126" height="54" rx="14"/>
    <text class="label" x="22" y="24">Serve</text>
    <text class="small" x="22" y="42">MCP, HTTP, export</text>
    <rect class="runtime" y="78" width="126" height="54" rx="14"/>
    <text class="label" x="22" y="102">Inspect</text>
    <text class="small" x="22" y="120">Studio and CLI</text>
  </g>

  <path class="line" d="M238 200 H294"/>
  <path class="line" d="M600 200 H662"/>
  <path class="line" d="M890 168 H944"/>
  <path class="line" d="M890 232 H944"/>

  <g transform="translate(250 350)">
    <rect class="control" width="620" height="98" rx="24"/>
    <text class="label" x="28" y="36">Operate versions without rebuilding</text>
    <text class="body" x="28" y="64">diff compares sealed builds</text>
    <text class="body" x="252" y="64">activate moves a pointer</text>
    <text class="body" x="476" y="64">rollback moves it back</text>
  </g>

  <path class="softLine" d="M742 292 C710 344 650 382 560 399"/>
  <path class="softLine" d="M806 292 C836 344 812 382 742 399"/>

  <text class="small" x="48" y="492">A failed build or deploy never corrupts the active build. Model-facing tools are read-only.</text>
</svg>
