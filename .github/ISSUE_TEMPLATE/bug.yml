name: Bug report
description: Something behaves incorrectly
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: "Reproducible reports get fixed. Please include the environment details below."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact commands, and the smallest project that shows the problem.
      placeholder: |
        lore build
        lore search "pricing"
    validations: {required: true}
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15.3 (Apple Silicon) / Windows 11 x64 / Ubuntu 24.04
    validations: {required: true}
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`. Lorepack supports >=24.15 <25.
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes:
      label: lore doctor --json
      description: Paste the output. It reports SQLite/FTS5 status, which explains most build failures.
      render: json
  - type: textarea
    id: build
    attributes:
      label: Build ID and warnings
      description: If relevant, the affected build ID and `lore inspect warnings` output.
