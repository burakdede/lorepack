name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to receive supply-chain artifacts
        required: true
        type: string
      publish:
        description: Publish npm packages after all checks pass
        required: true
        type: boolean
        default: false

env:
  NODE_VERSION: '24.18.1'

jobs:
  release:
    name: release artifacts and optional npm publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      - name: Generate dependency health report and CycloneDX SBOM
        run: pnpm supply-chain:report

      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain
          path: |
            reports/dependency-health.json
            reports/sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 90

      - name: Attach supply-chain artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" >/dev/null
          gh release upload "${{ inputs.tag }}" \
            reports/dependency-health.json \
            reports/sbom.cyclonedx.json \
            --clobber

      - name: Publish npm packages with provenance
        if: ${{ inputs.publish }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm changeset publish
