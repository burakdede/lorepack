name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version Changesets should write, such as 0.1.0 or 0.1.0-rc.1
        required: true
        type: string
      channel:
        description: npm dist tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      dry_run:
        description: Run every release step except commit, tag, GitHub release and npm publish
        required: true
        type: boolean
        default: true
      performance_report_url:
        description: URL of the green reference-machine performance report
        required: false
        type: string

env:
  NODE_VERSION: '24.18.1'
  RELEASE_COMMIT: ${{ github.sha }}

jobs:
  release:
    name: changesets release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify required release gates on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required_checks=(
            "verify (ubuntu-latest)"
            "verify (windows-latest)"
            "verify (macos-latest)"
            "acceptance (ubuntu-latest)"
            "acceptance (windows-latest)"
            "acceptance (macos-latest)"
            "clean install (ubuntu-latest)"
            "clean install (windows-latest)"
            "clean install (macos-latest)"
            "cloudflare acceptance (ubuntu-latest)"
            "studio e2e (ubuntu-latest)"
            "benchmarks (reported)"
          )
          check_commit() {
            local commit="$1"
            local all_green=true
            for name in "${required_checks[@]}"; do
              conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${commit}/check-runs" \
                --paginate \
                --jq ".check_runs[] | select(.name == \"$name\" and .status == \"completed\") | .conclusion" \
                | head -n 1)"
              if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ] || [ "$conclusion" = "timed_out" ]; then
                echo "::error::required release gate '$name' failed for $commit"
                return 2
              fi
              if [ "$conclusion" != "success" ]; then
                all_green=false
              fi
            done
            [ "$all_green" = true ]
          }
          for attempt in $(seq 1 30); do
            if check_commit "$RELEASE_COMMIT"; then
              exit 0
            elif [ "$?" -eq 2 ]; then
              exit 1
            fi
            pr_head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_COMMIT}/pulls" \
              --jq '.[0].head.sha // empty' \
              | head -n 1)"
            if [ -n "$pr_head" ] && [ "$pr_head" != "$RELEASE_COMMIT" ]; then
              if check_commit "$pr_head"; then
                echo "using green checks from merged pull request head $pr_head"
                exit 0
              elif [ "$?" -eq 2 ]; then
                exit 1
              fi
            fi
            echo "waiting for required release gates on $RELEASE_COMMIT (attempt $attempt/30)"
            sleep 10
          done
          echo "::error::required release gates did not all finish for $RELEASE_COMMIT"
          exit 1

      - name: Require the reference-machine performance report for stable publish
        if: ${{ !inputs.dry_run && inputs.channel == 'latest' }}
        run: |
          if [ -z "${{ inputs.performance_report_url }}" ]; then
            echo "::error::stable publish requires the green issue #101 performance report URL"
            exit 1
          fi

      - name: Require npm publish token for real release
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::real release requires the NPM_TOKEN repository secret before any release side effects"
            exit 1
          fi

      - run: pnpm verify

      - name: Apply Changesets version
        run: |
          pnpm changeset version
          node - <<'NODE'
          const { readdirSync, readFileSync, writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          const version = process.env.RELEASE_VERSION;
          const stableVersion = version.split('-')[0];
          const escapedStableVersion = stableVersion.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&');
          const manifests = [
            'package.json',
            ...readdirSync('packages').map((name) => `packages/${name}/package.json`),
          ];
          for (const manifest of manifests) {
            const path = join(process.cwd(), manifest);
            const data = JSON.parse(readFileSync(path, 'utf8'));
            if (data.private === true && manifest !== 'package.json') continue;
            data.version = version;
            writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          }
          const releaseHeading = new RegExp(`^## ${escapedStableVersion}$`, 'm');
          for (const name of readdirSync('packages')) {
            const path = join(process.cwd(), 'packages', name, 'CHANGELOG.md');
            let changelog;
            try {
              changelog = readFileSync(path, 'utf8');
            } catch {
              continue;
            }
            if (releaseHeading.test(changelog)) {
              writeFileSync(path, changelog.replace(releaseHeading, `## ${version}`));
            }
          }
          NODE
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - run: pnpm build

      - name: Generate dependency health report and CycloneDX SBOM
        env:
          LOREPACK_VERSION: ${{ inputs.version }}
        run: pnpm supply-chain:report

      - name: Build example .lorepack artifact
        run: |
          node packages/cli/dist/entry.js --cwd examples/product-research build
          node packages/cli/dist/entry.js --cwd examples/product-research pack --out product-research.lorepack

      - name: Pack npm tarballs for dry-run and release review
        run: pnpm -r --filter './packages/*' pack --pack-destination release-artifacts/npm

      - name: Prepare GitHub release notes
        run: |
          mkdir -p release-artifacts
          {
            echo "# v${{ inputs.version }}"
            echo
            echo "Released from ${RELEASE_COMMIT}."
            echo
            release_version="${{ inputs.version }}"
            if printf '%s' "$release_version" | grep -q -- '-'; then
              cat <<'EOF' | sed 's/^  //'
            ## Alpha status

            This is an alpha release. It is suitable for evaluation, but it is not a stable v0.1 release.

            - Cloudflare deploy is experimental.
            - The 1 GiB scale envelope is untested. See [issue #302](https://github.com/burakdede/lorepack/issues/302).
            - Approvals, evidence capture and semantic search are not in v0.1.

            Read the [limitations](https://github.com/burakdede/lorepack/blob/main/docs/limitations.md) and the [GHSA-c53f-24h5-74qj advisory](https://github.com/advisories/GHSA-c53f-24h5-74qj) before using this release.

          EOF
            fi
            echo "## Package changelogs"
            for changelog in packages/*/CHANGELOG.md; do
              [ -f "$changelog" ] || continue
              echo
              echo "### ${changelog%/CHANGELOG.md}"
              sed -n '1,120p' "$changelog"
            done
          } > release-artifacts/release-notes.md

      - name: Upload dry-run release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            release-artifacts/npm/*.tgz
            reports/dependency-health.json
            reports/sbom.cyclonedx.json
            examples/product-research/product-research.lorepack
            release-artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 90

      - name: Stop before side effects during dry run
        if: ${{ inputs.dry_run }}
        run: |
          git diff --exit-code -- . ':(exclude)reports/dependency-health.json' ':(exclude)reports/sbom.cyclonedx.json' || true
          echo "dry run complete: no commit, tag, GitHub release or npm publish was created"

      - name: Commit version and generated release artifacts
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset package.json packages/*/package.json reports/dependency-health.json reports/sbom.cyclonedx.json
          git add packages/*/CHANGELOG.md 2>/dev/null || true
          git commit -m "Release v${{ inputs.version }} [no release]"
          release_branch="release/v${{ inputs.version }}"
          release_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${release_branch}"
          pr_url="$(gh pr create \
            --base main \
            --head "$release_branch" \
            --title "Release v${{ inputs.version }}" \
            --body "Refs #455. This release PR records the generated package versions, changelogs and supply-chain evidence before publishing.")"
          gh workflow run ci.yml --ref "$release_branch"
          gh workflow run commit-hygiene.yml --ref "$release_branch"
          wait_for_workflow() {
            workflow="$1"
            run_id=""
            for attempt in $(seq 1 30); do
              run_id="$(gh run list \
                --workflow "$workflow" \
                --branch "$release_branch" \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$release_head\") | .databaseId" | head -n 1)"
              if [ -n "$run_id" ]; then
                break
              fi
              echo "waiting for $workflow run (attempt $attempt/30)"
              sleep 10
            done
            test -n "$run_id"
            gh run watch "$run_id" --exit-status
          }
          wait_for_workflow ci.yml
          wait_for_workflow commit-hygiene.yml
          gh pr merge "$pr_url" --squash --delete-branch=false
          release_target="$(gh pr view "$pr_url" --json mergeCommit --jq '.mergeCommit.oid')"
          test -n "$release_target"
          echo "RELEASE_TARGET=$release_target" >> "$GITHUB_ENV"

      - name: Create GitHub release with SBOM and example artifact
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_options=()
          if printf '%s' "${{ inputs.version }}" | grep -q -- '-'; then
            release_options+=(--prerelease)
          fi
          gh release create "v${{ inputs.version }}" \
            --target "$RELEASE_TARGET" \
            "${release_options[@]}" \
            --title "v${{ inputs.version }}" \
            --notes-file release-artifacts/release-notes.md \
            reports/dependency-health.json \
            reports/sbom.cyclonedx.json \
            examples/product-research/product-research.lorepack

      - name: Publish npm packages with provenance
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm changeset publish --tag "${{ inputs.channel }}"
