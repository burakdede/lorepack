name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.18.1'

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Fail if the resolved Node leaves the supported range
        shell: bash
        run: |
          version="$(node -p 'process.versions.node')"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          if [ "$major" -ne 24 ] || [ "$minor" -lt 15 ]; then
            echo "::error::Node $version is outside the supported range >=24.15 <25"
            exit 1
          fi
          echo "Node $version is inside the supported range"

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - name: Architecture rules
        run: pnpm test:arch

      - run: pnpm test

      - run: pnpm check:no-native

      - run: pnpm check:no-em-dash

      - name: Nothing claims Lorepack detected a conflict
        run: pnpm check:no-conflict-claims

      - run: pnpm check:counted-nouns

      - name: Every command the sources mention is registered
        run: pnpm check:command-set

      - name: Studio fits its bundle budget
        run: pnpm check:studio-bundle

      - name: Every source file is tracked by git
        run: pnpm check:sources-tracked

      # Tracked, not merely present. Six generated PNGs sat in `docs/images/` behind a blanket
      # `*.png` ignore, so the README shipped with broken icons (#214).
      - name: Every documentation image is referenced and tracked
        run: pnpm check:docs-images

      # These steps and `pnpm verify` are one list. This is what says so.
      - name: CI and `pnpm verify` run the same checks
        run: pnpm check:verify-parity

      - name: Public schemas match their Zod definitions
        run: pnpm schemas:check

      - name: SQLite has FTS5
        run: pnpm probe:fts5

      - name: The acceptance checklist matches the scenario catalogue
        run: pnpm acceptance:docs:check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            coverage/
            **/vitest-report.json
          if-no-files-found: ignore
          retention-days: 7

  acceptance:
    # A separate job, not a step in `verify`, for two reasons: it is minutes rather than
    # seconds, and when it fails the question is "which scenario" rather than "which test".
    # Mixing it into the unit run buries that answer.
    name: acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Every acceptance scenario, against the real binary
        run: pnpm acceptance

  cloudflare-acceptance:
    name: cloudflare acceptance (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LORE_CF_TEST_PREFIX: ${{ secrets.LORE_CF_TEST_PREFIX }}
      LORE_CF_ARTIFACT_DIR: tools/acceptance/cloudflare-artifacts
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Cloudflare acceptance smoke and environment gate
        working-directory: tools/acceptance
        run: pnpm exec vitest run test/cloudflare-smoke.test.ts test/cloudflare-testing.test.ts

      - name: Upload Cloudflare acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-acceptance-artifacts
          path: tools/acceptance/cloudflare-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  studio-e2e:
    # Studio in a real browser, against a real `lore dev`.
    #
    # One OS, deliberately. This suite answers "does the assembled application work against
    # the real API, by keyboard, at the documented viewport", and none of those are questions
    # about operating systems. The cross-platform matrix that matters is the CLI's, and it
    # already runs on three.
    #
    # A separate job because it downloads a browser, which nothing else here does. The
    # download is explicit and cached, so `pnpm install` stays script-free (invariant 7).
    name: studio e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Every route, by keyboard, with axe, against a real server
        run: pnpm test:e2e

      - name: Upload the report and any failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-e2e-report
          path: |
            tools/studio-e2e/playwright-report/
            tools/studio-e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  clean-install:
    # Invariant 7, the zero-surprise install promise, tested rather than asserted.
    #
    # `--ignore-scripts` is the portable proof: if the product installs and runs with every
    # lifecycle script suppressed, then no install step compiles anything, downloads
    # anything, or needs a toolchain to exist. Combined with `check:no-native`, which fails
    # if a native package appears anywhere in the tree, that covers the claim on every
    # platform rather than only on the one image that happens to lack a compiler.
    #
    # A separate job from `verify` because it deliberately installs differently. Folding it
    # in would mean the normal suite ran under an install nobody ships.
    name: clean install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install with every lifecycle script suppressed
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: No native add-on and no install hook anywhere in the tree
        run: pnpm check:no-native

      - run: pnpm build

      - name: The product runs, from an install that ran no scripts
        shell: bash
        run: |
          set -euo pipefail
          project="$(mktemp -d)"
          mkdir -p "$project/docs"
          printf '# Runbook\n\n## Rollback\n\nRun lore rollback.\n' > "$project/docs/a.md"

          lore() { node packages/cli/dist/entry.js --cwd "$project" "$@"; }

          lore init .
          lore build
          lore search rollback --json > "$project/result.json"
          node -e "
            const r = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'));
            if (!r.hits?.length) { console.error('no hits'); process.exit(1); }
            if (!r.hits[0].locator?.relativePath) { console.error('no locator'); process.exit(1); }
            console.log('clean install: built and searched, every hit cited');
          " "$project/result.json"

      - name: The doctor agrees the environment is usable
        run: node packages/cli/dist/entry.js doctor --ci

      - name: Studio was built and stays within its budget
        run: pnpm check:studio-bundle

  benchmarks:
    name: benchmarks (reported, not enforced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Reported for trend tracking, never a gate. A shared CI runner is not the reference
      # machine (backlog #101), so failing a build on its timings would only produce noise.
      - name: Measure build, incremental rebuild and warm search
        run: node scripts/bench.mjs --out benchmarks/ci-${{ github.run_id }}.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: benchmarks/ci-*.json
          if-no-files-found: error
          retention-days: 30
