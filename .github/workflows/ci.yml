name: State open full-schedule diagnosis (not release qualification)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-open-diagnostic:
    name: State open diagnostic (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: pnpm
      - name: Restore the original workflow input for policy tests
        run: >-
          node --input-type=module -e 'import {execFileSync} from "node:child_process"; import {writeFileSync} from "node:fs"; const file=".github/workflows/ci.yml"; writeFileSync(file,execFileSync("git",["show","4848b1afab61e4cb9a0e118a2e98d7958d328285:"+file]));'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Record the actual diagnostic environment
        run: node -p 'JSON.stringify({node:process.versions.node,sqlite:process.versions.sqlite,platform:process.platform,arch:process.arch})'
      - name: Record the complete original default workload (diagnostic only)
        run: pnpm exec vitest run --reporter=verbose
