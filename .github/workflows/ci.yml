name: State open diagnosis (not release qualification)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-open-diagnostic:
    name: State open diagnostic (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Record the actual diagnostic environment
        run: node -p 'JSON.stringify({node:process.versions.node,sqlite:process.versions.sqlite,platform:process.platform,arch:process.arch})'
      - name: Run the original state-open workload with failure stacks
        run: pnpm exec vitest run packages/backend-local/test/state-open-concurrency.test.ts --reporter=verbose
