name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.18.1'

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Fail if the resolved Node leaves the supported range
        shell: bash
        run: |
          version="$(node -p 'process.versions.node')"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          if [ "$major" -ne 24 ] || [ "$minor" -lt 15 ]; then
            echo "::error::Node $version is outside the supported range >=24.15 <25"
            exit 1
          fi
          echo "Node $version is inside the supported range"

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - name: Architecture rules
        run: pnpm test:arch

      - run: pnpm test

      - run: pnpm check:no-native

      - run: pnpm check:no-em-dash

      - name: Every source file is tracked by git
        run: pnpm check:sources-tracked

      - name: Public schemas match their Zod definitions
        run: pnpm schemas:check

      - name: SQLite has FTS5
        run: pnpm probe:fts5

      - name: The acceptance checklist matches the scenario catalogue
        run: pnpm acceptance:docs:check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            coverage/
            **/vitest-report.json
          if-no-files-found: ignore
          retention-days: 7

  acceptance:
    # A separate job, not a step in `verify`, for two reasons: it is minutes rather than
    # seconds, and when it fails the question is "which scenario" rather than "which test".
    # Mixing it into the unit run buries that answer.
    name: acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Every acceptance scenario, against the real binary
        run: pnpm acceptance

  benchmarks:
    name: benchmarks (reported, not enforced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Reported for trend tracking, never a gate. A shared CI runner is not the reference
      # machine (backlog #101), so failing a build on its timings would only produce noise.
      - name: Measure build, incremental rebuild and warm search
        run: node scripts/bench.mjs --out benchmarks/ci-${{ github.run_id }}.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: benchmarks/ci-*.json
          if-no-files-found: error
          retention-days: 30
