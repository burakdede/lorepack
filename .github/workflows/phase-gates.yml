name: Phase gates

# Runs on main rather than on pull requests, because a phase gate answers "is this phase
# still satisfied on the trunk?". On a pull request the issue-closure criterion would fail
# for the very issue being merged, which is a paradox, not a signal.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      phase:
        description: Phase number to verify
        default: '0'

concurrency:
  group: phase-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-phase:
    name: phase ${{ github.event.inputs.phase || '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.1'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify the phase against its executable criteria
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm phase:check ${{ github.event.inputs.phase || '0' }}

      - name: Publish the report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Phase gate'
            echo
            echo '```'
            pnpm phase:check ${{ github.event.inputs.phase || '0' }} || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
