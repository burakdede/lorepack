name: Phase gates

# Runs on main rather than on pull requests, because a phase gate answers "is this phase
# still satisfied on the trunk?". On a pull request the issue-closure criterion would fail
# for the very issue being merged, which is a paradox, not a signal.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      phase:
        description: Single phase number to verify. Leave empty to verify every defined phase.
        required: false

concurrency:
  group: phase-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-phase:
    name: phase ${{ matrix.phase }}
    runs-on: ubuntu-latest
    strategy:
      # Every defined phase is verified on each push. A phase that closed months ago is
      # exactly the one whose guarantees quietly rot, so re-running it is the point.
      fail-fast: false
      matrix:
        phase: ${{ github.event.inputs.phase && fromJSON(format('[{0}]', github.event.inputs.phase)) || fromJSON('[0, 1, 2, 3, 4, 5, 6, 7]') }}
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache the browser
        id: browser-cache
        if: ${{ matrix.phase == 4 }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: ${{ matrix.phase == 4 && steps.browser-cache.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify the phase against its executable criteria
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          pnpm phase:check ${{ matrix.phase }} 2>&1 | tee "$RUNNER_TEMP/phase-check.log"
          statuses=("${PIPESTATUS[@]}")
          if (( statuses[1] != 0 )); then
            exit "${statuses[1]}"
          fi
          exit "${statuses[0]}"

      - name: Publish the report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Phase gate ${{ matrix.phase }}'
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/phase-check.log" ]; then
              cat "$RUNNER_TEMP/phase-check.log"
            else
              echo 'Phase check output was not captured.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
