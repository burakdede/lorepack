name: Phase gates

# Runs on main rather than on pull requests, because a phase gate answers "is this phase
# still satisfied on the trunk?". On a pull request the issue-closure criterion would fail
# for the very issue being merged, which is a paradox, not a signal.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      phase:
        description: Single phase number to verify. Leave empty to verify every defined phase.
        required: false

concurrency:
  group: phase-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-phase:
    name: phase ${{ matrix.phase }}
    runs-on: ubuntu-latest
    strategy:
      # Every defined phase is verified on each push. A phase that closed months ago is
      # exactly the one whose guarantees quietly rot, so re-running it is the point.
      fail-fast: false
      matrix:
        phase: ${{ github.event.inputs.phase && fromJSON(format('[{0}]', github.event.inputs.phase)) || fromJSON('[0, 1]') }}
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.1'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify the phase against its executable criteria
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm phase:check ${{ matrix.phase }}

      - name: Publish the report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Phase gate ${{ matrix.phase }}'
            echo
            echo '```'
            pnpm phase:check ${{ matrix.phase }} || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
