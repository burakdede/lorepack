name: Benchmark evidence

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Corpus scale for this run
        required: true
        default: medium
        type: choice
        options: [small, medium, large]
      hosted:
        description: Run the provider-backed RAG smoke test
        required: true
        default: false
        type: boolean
      qualification:
        description: Select the manual qualification workload
        required: false
        default: benchmark
        type: choice
        options: [benchmark, coverage, windows-observer]

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}-${{ inputs.qualification == 'coverage' && 'coverage' || inputs.qualification == 'windows-observer' && 'windows-observer' || inputs.profile || 'small' }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.21.0'
  BENCHMARK_PROFILE: ${{ github.event_name == 'pull_request' && 'small' || inputs.profile || 'medium' }}

jobs:
  benchmark:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.qualification || 'benchmark') == 'benchmark' }}
    name: benchmark (${{ matrix.os }}, ${{ github.event_name == 'pull_request' && 'small' || inputs.profile || 'medium' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Select the declared corpus profile
        shell: bash
        run: |
          set -euo pipefail
          case "$BENCHMARK_PROFILE" in
            small) packs=1 ;;
            medium) packs=10 ;;
            large) packs=40 ;;
            *) echo "::error::Unknown benchmark profile $BENCHMARK_PROFILE"; exit 1 ;;
          esac
          {
            echo "LORE_BENCH_PACKS=$packs"
            echo "LORE_BENCH_SCALE=$BENCHMARK_PROFILE"
            echo 'LORE_BENCH_PROFILE=mixed'
          } >> "$GITHUB_ENV"

      - name: Run Lorepack, FTS5 and offline RAG with Windows observer diagnostics
        shell: bash
        env:
          LOREPACK_OBSERVER_DIAGNOSTIC: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          node scripts/bench-retrieval-comparison.mjs --out "benchmark-artifacts/comparison-${RUNNER_OS}.json"
          node scripts/bench-rag.mjs --out "benchmark-artifacts/rag-${RUNNER_OS}.json"
          node scripts/bench-usefulness.mjs --out "benchmark-artifacts/usefulness-${RUNNER_OS}.json"
          node scripts/research-safe-pruning.mjs --out "benchmark-artifacts/pruning-${RUNNER_OS}.json"

      - name: Validate and render this runner row
        shell: bash
        run: node scripts/check-benchmark-artifacts.mjs benchmark-artifacts --summary benchmark-artifacts/summary.md

      - name: Upload raw benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ github.run_id }}-${{ matrix.os }}
          path: benchmark-artifacts/
          if-no-files-found: error
          retention-days: 30

  summary:
    name: benchmark summary
    if: ${{ needs.benchmark.result == 'success' && (github.event_name != 'workflow_dispatch' || (inputs.qualification || 'benchmark') == 'benchmark') }}
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download all runner rows
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-${{ github.run_id }}-*
          path: benchmark-artifacts
          merge-multiple: true

      - name: Validate and render the cross-platform report
        run: node scripts/check-benchmark-artifacts.mjs benchmark-artifacts --summary benchmark-artifacts/summary.md

      - name: Publish the machine-readable evidence report
        run: |
          node scripts/render-benchmark-evidence.mjs benchmark-artifacts \
            --json benchmark-artifacts/evidence.json \
            --markdown benchmark-artifacts/evidence.md

      - name: Publish the comparison summary
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ github.run_id }}-summary
          path: |
            benchmark-artifacts/summary.md
            benchmark-artifacts/evidence.json
            benchmark-artifacts/evidence.md
          if-no-files-found: error
          retention-days: 90

  hosted-rag:
    name: hosted RAG smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.hosted == true && (inputs.qualification || 'benchmark') == 'benchmark' }}
    environment: benchmark-hosted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run the explicitly authorized hosted RAG profile
        env:
          LORE_BENCH_PACKS: 1
          LORE_BENCH_SCALE: small
          RAG_BENCH_MODE: hosted
          RAG_BENCH_ENDPOINT: ${{ secrets.RAG_BENCH_ENDPOINT }}
          RAG_BENCH_API_KEY: ${{ secrets.RAG_BENCH_API_KEY }}
          RAG_BENCH_MODEL: ${{ secrets.RAG_BENCH_MODEL }}
          RAG_BENCH_TOKENIZER: ${{ secrets.RAG_BENCH_TOKENIZER }}
        run: |
          set -euo pipefail
          mkdir -p benchmark-hosted
          node scripts/bench-rag.mjs --out benchmark-hosted/rag-hosted.json
          node scripts/benchmark-report.mjs benchmark-hosted/rag-hosted.json
      - name: Upload hosted report without model responses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ github.run_id }}-hosted-rag
          path: benchmark-hosted/
          if-no-files-found: error
          retention-days: 30

  coverage:
    name: original all-nine coverage (ubuntu-latest)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification == 'coverage' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture the original nine bundles and source custody
        shell: bash
        env:
          TMPDIR: /tmp
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/lorepack-nine"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, time

          root = pathlib.Path.cwd()
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lorepack-nine'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def save(name, value):
              (evidence / name).write_text(json.dumps(value, indent=2) + '\n')
          def sha(path):
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(block)
              return digest.hexdigest()
          def sources():
              paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
              return {p: sha(root / p) for p in paths if p}
          def builds():
              directories = [package / 'dist' for package in sorted(root.glob('packages/*')) if package.is_dir()]
              directories += [root / 'apps/studio/dist', root / 'packages/cli/studio-dist']
              records = {}
              for directory in directories:
                  records[str(directory.relative_to(root))] = {
                      'exists': directory.exists(),
                      'files': {str(p.relative_to(root)): (
                          {'symlink': os.readlink(p)} if p.is_symlink() else {'sha256': sha(p)}
                      ) for p in sorted(directory.rglob('*')) if p.is_symlink() or p.is_file()},
                  }
              return records
          def processes(name):
              with (evidence / name).open('w') as stream:
                  subprocess.run(['ps', '-eo', 'pid,ppid,pgid,lstart,comm'], stdout=stream, check=True)

          head, tree, status = git('rev-parse', 'HEAD'), git('rev-parse', 'HEAD^{tree}'), git('status', '--porcelain')
          versions = {tool: subprocess.check_output([tool, '--version'], text=True).strip() for tool in ['node', 'pnpm']}
          save('identity.json', {'head': head, 'tree': tree, 'status': status, 'versions': versions,
              'workflowRef': os.environ['GITHUB_WORKFLOW_REF'], 'workflowSha': os.environ['GITHUB_WORKFLOW_SHA'],
              'requestedRef': os.environ['GITHUB_REF'], 'eventSha': os.environ['GITHUB_SHA'],
              'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'platform': list(os.uname()), 'cwd': str(root), 'TMPDIR': os.environ['TMPDIR']})
          if status or head != os.environ['GITHUB_SHA'] or versions != {'node': 'v24.21.0', 'pnpm': '11.18.0'}:
              raise RuntimeError('Candidate or pinned runtime mismatch')
          before = sources()
          save('sources.before.json', before)
          save('builds.before.json', builds())
          subprocess.run(['git', 'archive', '--format=tar', '-o', str(evidence / 'source.tar'), head], check=True)
          subprocess.run(['git', 'bundle', 'create', str(evidence / 'source.bundle'), 'HEAD'], check=True)
          processes('processes.before.txt')
          command = ['pnpm', 'coverage:capture', '--suite', 'all', '--out', str(evidence / 'capture')]
          started = time.time()
          with (evidence / 'campaign.raw.log').open('wb') as log:
              child = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
              save('campaign.started.json', {'argv': command, 'pid': child.pid, 'processGroup': child.pid, 'started': started})
              code = child.wait()
          processes('processes.after.txt')
          remaining = subprocess.check_output(['ps', '-eo', 'pid=,pgid='], text=True)
          owned_group = [line.strip() for line in remaining.splitlines() if line.split()[-1] == str(child.pid)]
          after = sources()
          save('sources.after.json', after)
          save('builds.after.json', builds())
          unchanged = before == after and git('rev-parse', 'HEAD') == head and git('status', '--porcelain') == ''
          save('campaign.exit.json', {'exit': code, 'started': started, 'ended': time.time(),
              'sourceUnchanged': unchanged, 'remainingCampaignGroup': owned_group,
              'cleanup': 'observed group only; detached descendants require receipt review'})
          if code or not unchanged or owned_group:
              sys.exit(code if 0 < code < 256 else 1)
          PY
      - name: Hash all retained bytes including partial native streams
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lorepack-nine"
          find . -type f ! -path ./SHA256SUMS -print0 > "$RUNNER_TEMP/lorepack-nine-files.list"
          sort -z "$RUNNER_TEMP/lorepack-nine-files.list" | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS > "$RUNNER_TEMP/lorepack-nine-hash-check.log"
      - name: Retain original coverage custody
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: all-nine-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lorepack-nine/
            ${{ runner.temp }}/lorepack-nine-hash-check.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  windows-observer:
    name: Windows observer diagnostic case
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification == 'windows-observer' }}
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      LOREPACK_OBSERVER_DIAGNOSTIC: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Record the exact diagnostic source and runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'lorepack-windows-observer'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $head = (& git rev-parse HEAD).Trim()
          $tree = (& git rev-parse 'HEAD^{tree}').Trim()
          $status = (& git status --porcelain | Out-String).Trim()
          $node = (& node --version).Trim()
          $pnpm = (& pnpm --version).Trim()
          @{
            head = $head; tree = $tree; status = $status
            node = $node; pnpm = $pnpm; cwd = $PWD.Path
            workflowRef = $env:GITHUB_WORKFLOW_REF; workflowSha = $env:GITHUB_WORKFLOW_SHA
            requestedRef = $env:GITHUB_REF; eventSha = $env:GITHUB_SHA
            run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT
            platform = $env:RUNNER_OS; observerDiagnostic = $env:LOREPACK_OBSERVER_DIAGNOSTIC
          } | ConvertTo-Json | Set-Content (Join-Path $evidence 'identity.json')
          if ($status -or $head -ne $env:GITHUB_SHA -or $node -ne 'v24.21.0' -or $pnpm -ne '11.18.0') {
            throw 'Diagnostic source or pinned runtime differs'
          }
      - name: Install the frozen dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP 'lorepack-windows-observer'
          & pnpm install --frozen-lockfile 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'install.raw.log')
          $code = $LASTEXITCODE
          Set-Content (Join-Path $evidence 'install.exit.txt') $code
          exit $code
      - name: Build the actual diagnostic candidate
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP 'lorepack-windows-observer'
          & pnpm build 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'build.raw.log')
          $code = $LASTEXITCODE
          Set-Content (Join-Path $evidence 'build.exit.txt') $code
          exit $code
      - name: Run the full-suite Studio rollback case alone
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP 'lorepack-windows-observer'
          $report = Join-Path $evidence 'studio-rollback.json'
          & pnpm exec vitest run --project cli packages/cli/test/studio_rollback_race.test.ts -t 'rechecks the target after the lock holder selects unchanged' --reporter=default --reporter=json "--outputFile=$report" 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'studio-rollback.raw.log')
          $code = $LASTEXITCODE
          Set-Content (Join-Path $evidence 'studio-rollback.exit.txt') $code
          exit $code
      - name: Run the full-suite retrieval filter case alone
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP 'lorepack-windows-observer'
          $report = Join-Path $evidence 'retrieval-filter.json'
          & pnpm exec vitest run --project cli packages/cli/test/retrieval.test.ts -t 'narrows by path glob, by extension, and returns nothing rather than guessing' --reporter=default --reporter=json "--outputFile=$report" 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'retrieval-filter.raw.log')
          $code = $LASTEXITCODE
          Set-Content (Join-Path $evidence 'retrieval-filter.exit.txt') $code
          exit $code
      - name: Measure the XLSX shared-string budget case alone
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP 'lorepack-windows-observer'
          $report = Join-Path $evidence 'xlsx-shared-strings.json'
          & pnpm exec vitest run --project parsers packages/parsers/test/xlsx.test.ts -t 'warns when shared-string items exceed the retained table budget' --testTimeout=30000 --reporter=default --reporter=json "--outputFile=$report" 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'xlsx-shared-strings.raw.log')
          $code = $LASTEXITCODE
          Set-Content (Join-Path $evidence 'xlsx-shared-strings.exit.txt') $code
          exit $code
      - name: Run only the existing large-result pipe acceptance case
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP 'lorepack-windows-observer'
          $report = Join-Path $evidence 'acceptance.json'
          & pnpm exec vitest run --root tools/acceptance -t output/a-large-result-survives-a-pipe --reporter=default --reporter=json "--outputFile=$report" 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'acceptance.raw.log')
          $code = $LASTEXITCODE
          Set-Content (Join-Path $evidence 'acceptance.exit.txt') $code
          exit $code
      - name: Run the complete serial CLI project with observer tracing
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP 'lorepack-windows-observer'
          $report = Join-Path $evidence 'cli-project.json'
          & pnpm exec vitest run --project cli --reporter=default --reporter=json "--outputFile=$report" 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'cli-project.raw.log')
          $code = $LASTEXITCODE
          Set-Content (Join-Path $evidence 'cli-project.exit.txt') $code
          exit $code
      - name: Retain the final source state and artifact hashes
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'lorepack-windows-observer'
          if (Test-Path $evidence) {
            & git rev-parse HEAD | Set-Content (Join-Path $evidence 'head.after.txt')
            & git status --porcelain | Set-Content (Join-Path $evidence 'status.after.txt')
            $hashes = @(Get-ChildItem -Path $evidence -File |
              Where-Object Name -ne 'hashes.json' | Get-FileHash -Algorithm SHA256 |
              Select-Object Path, Hash)
            $hashes | ConvertTo-Json | Set-Content (Join-Path $evidence 'hashes.json')
          }
      - name: Upload the Windows observer evidence even after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lorepack-windows-observer/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
