name: Public registry smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published @lorepack/cli version (unused in local tarball mode)
        required: true
        type: string
      tarball:
        description: Verify a local tarball without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: '24.21.0'

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.tarball }}
    name: public registry smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          # The provenance check compares the package with the release tag's commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve and validate the published version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${MANUAL_VERSION:-$RELEASE_TAG}"
          version="${version#v}"
          VERSION="$version" node --input-type=module <<'NODE'
            const version = process.env.VERSION;
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
              console.error('invalid release version: ' + version);
              process.exit(1);
            }
          NODE
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Confirm the package is public at the requested version
        shell: bash
        env:
          LOREPACK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            actual="$(npm view "@lorepack/cli@${LOREPACK_VERSION}" version 2>/dev/null || true)"
            if [ "$actual" = "$LOREPACK_VERSION" ]; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::@lorepack/cli@$LOREPACK_VERSION was not visible in the public registry"
              exit 1
            fi
            sleep 10
          done

      - name: Verify registry signatures and provenance attestations
        shell: bash
        env:
          LOREPACK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          project="$(mktemp -d)"
          (
            cd "$project"
            npm init --yes >/dev/null
            npm install --ignore-scripts --no-audit --no-fund "@lorepack/cli@${LOREPACK_VERSION}"
            npm audit signatures
          )

      - name: Assert gitHead and provenance name the release tag's commit
        shell: bash
        env:
          LOREPACK_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/check-registry-provenance.mjs "$LOREPACK_VERSION"

      - name: Install the published CLI with npm and check it carries no native add-on
        shell: bash
        env:
          LOREPACK_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/check-packed-cli.mjs --spec "@lorepack/cli@${LOREPACK_VERSION}"

      - name: Install the published CLI without lifecycle scripts
        shell: bash
        env:
          LOREPACK_VERSION: ${{ steps.version.outputs.version }}
        run: npm install --global --ignore-scripts "@lorepack/cli@${LOREPACK_VERSION}"

      - name: Exercise the public package and assert provenance
        shell: bash
        env:
          LOREPACK_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/public-registry-smoke.mjs "$LOREPACK_VERSION"

      - name: Record the tested release in the summary
        if: always()
        shell: bash
        env:
          LOREPACK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Public registry smoke"
            echo
            echo "- version: $LOREPACK_VERSION"
            echo "- platform: ${RUNNER_OS}"
            echo "- Node: $(node --version)"
          } >> "$GITHUB_STEP_SUMMARY"

  tarball:
    name: global tarball smoke (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tarball }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the actual global tarball and run the public smoke
        run: node scripts/check-global-smoke.mjs --out global-smoke-evidence
      - name: Retain source, tarball and actual result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: global-smoke-${{ matrix.os }}
          path: global-smoke-evidence/
          if-no-files-found: error
          retention-days: 7
