name: Public registry smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published @lorepack/cli version to verify
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '24.18.1'

jobs:
  smoke:
    name: public registry smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Resolve and validate the published version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${MANUAL_VERSION:-$RELEASE_TAG}"
          version="${version#v}"
          VERSION="$version" node --input-type=module <<'NODE'
            const version = process.env.VERSION;
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
              console.error('invalid release version: ' + version);
              process.exit(1);
            }
          NODE
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Confirm the package is public at the requested version
        shell: bash
        env:
          LOREPACK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            actual="$(npm view "@lorepack/cli@${LOREPACK_VERSION}" version 2>/dev/null || true)"
            if [ "$actual" = "$LOREPACK_VERSION" ]; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::@lorepack/cli@$LOREPACK_VERSION was not visible in the public registry"
              exit 1
            fi
            sleep 10
          done

      - name: Install the published CLI without lifecycle scripts
        shell: bash
        env:
          LOREPACK_VERSION: ${{ steps.version.outputs.version }}
        run: npm install --global --ignore-scripts "@lorepack/cli@${LOREPACK_VERSION}"

      - name: Exercise the public package and assert provenance
        shell: bash
        env:
          LOREPACK_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/public-registry-smoke.mjs "$LOREPACK_VERSION"

      - name: Record the tested release in the summary
        if: always()
        shell: bash
        env:
          LOREPACK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Public registry smoke"
            echo
            echo "- version: $LOREPACK_VERSION"
            echo "- platform: ${RUNNER_OS}"
            echo "- Node: $(node --version)"
          } >> "$GITHUB_STEP_SUMMARY"
